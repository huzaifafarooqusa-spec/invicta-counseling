<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Footer Section (Enhanced Dropdown)</title>
    <style>
        /* Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap');

        /* Main Footer Styling */
        .invicta-footer {
            background-color: #0E2D5B;
            color: #FFFFFF;
            font-family: 'Outfit', sans-serif;
            padding: 80px 40px 60px 40px;
        }

        .footer-container { max-width: 1200px; margin: auto; }

        /* Top part of the footer */
        .footer-top {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 30px; padding-bottom: 45px;
        }
        .footer-logo img { max-width: 180px; }

        .footer-nav nav { display: flex; gap: 35px; flex-wrap: wrap; align-items: center; }
        .footer-nav a {
            color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 500; transition: color .3s ease;
        }
        .footer-nav a.nav-link-grey { color: rgba(255,255,255,.7); }
        .footer-nav a:hover, .dropdown:hover .dropbtn { color: #FCB040; }

        /* --- Dropdown Styling (Enhanced) --- */
        .dropdown { position: relative; display: inline-block; }
        .dropbtn {
            color: rgba(255,255,255,.85); font-size: 16px; font-weight: 500; font-family: 'Outfit', sans-serif;
            cursor: pointer; padding: 20px 0; margin: -20px 0; /* keep layout but enlarge hover zone */
            display: inline-flex; align-items: center; gap: 8px;
        }
        .dropbtn:focus-visible { outline: 2px solid #FCB040; outline-offset: 3px; border-radius: 6px; }
        .dropbtn .caret { width: 12px; height: 12px; transition: transform .25s ease, color .25s ease; display: inline-block; }
        .dropdown:hover .dropbtn .caret, .dropdown:focus-within .dropbtn .caret { transform: rotate(180deg); color: #FCB040; }

        .dropdown-content {
            position: absolute; left: 0; top: 100%; min-width: 220px;
            background: rgba(255,255,255,0.98); color: #0E2D5B; border-radius: 10px;
            box-shadow: 0 14px 30px rgba(0,0,0,.18), 0 3px 10px rgba(0,0,0,.12);
            border: 1px solid rgba(14,45,91,.12);
            padding: 8px; margin-top: 0; z-index: 10;

            /* Smooth open/close */
            opacity: 0; visibility: hidden; pointer-events: none;
            transform: translateY(8px) scale(.98);
            transition: opacity .18s ease, transform .18s ease, visibility 0s linear .18s;
            -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
        }
        /* small arrow pointer */
        .dropdown-content::before {
            content: ""; position: absolute; top: -6px; left: 18px; width: 12px; height: 12px; background: #fff;
            transform: rotate(45deg); border-left: 1px solid rgba(14,45,91,.12); border-top: 1px solid rgba(14,45,91,.12);
        }
        .dropdown:hover .dropdown-content,
        .dropdown:focus-within .dropdown-content {
            opacity: 1; visibility: visible; pointer-events: auto;
            transform: translateY(12px) scale(1);
            transition-delay: 0s;
        }

        .dropdown-content a {
            position: relative; display: block; text-decoration: none; color: #0E2D5B;
            padding: 10px 14px; border-radius: 8px; font-size: 15px; font-weight: 500;
            transition: background .22s ease, color .22s ease, transform .12s ease;
            margin: 2px 2px;
        }
        /* left accent + subtle slide */
        .dropdown-content a::before {
            content: ""; position: absolute; left: 8px; top: 8px; bottom: 8px; width: 3px; border-radius: 2px;
            background: #FCB040; opacity: 0; transform: scaleY(.4); transition: transform .22s ease, opacity .22s ease;
        }
        .dropdown-content a:hover, .dropdown-content a:focus-visible {
            background: linear-gradient(90deg, rgba(252,176,64,0.16), rgba(252,176,64,0.06) 60%, transparent 100%);
            color: #0E2D5B; transform: translateX(2px);
        }
        .dropdown-content a:hover::before, .dropdown-content a:focus-visible::before { opacity: 1; transform: scaleY(1); }

        .footer-social { display: flex; gap: 15px; }
        .footer-social a { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: 1.5px solid #FFFFFF; border-radius: 50%; transition: all .3s ease; }
        .footer-social a:hover { border-color: #FCB040; }
        .footer-social a:hover svg { fill: #FCB040; }
        .footer-social svg { width: 20px; height: 20px; fill: #FFFFFF; transition: fill .3s ease; }

        /* Bottom part of the footer */
        .footer-bottom { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 30px; padding-top: 45px; border-top: 1px solid rgba(255,255,255,.3); }
        .footer-contact { display: flex; gap: 50px; flex-wrap: wrap; }
        .contact-item { display: flex; align-items: center; gap: 15px; }
        .contact-icon img { width: 45px; height: 45px; }
        .contact-text span { display: block; font-size: 14px; color: rgba(255,255,255,.7); }
        .contact-text a { color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 500; }
        .footer-copyright { font-size: 14px; color: rgba(255,255,255,.7); }

        /* Responsive adjustments */
        @media (max-width: 992px) {
            .footer-top, .footer-bottom { flex-direction: column; text-align: center; }
            .footer-logo { order: -1; }
            .footer-nav nav { justify-content: center; }
            .footer-bottom { padding-top: 30px; margin-top: 30px; }
            .dropdown-content { left: 50%; transform: translate(-50%, 8px) scale(.98); }
            .dropdown:hover .dropdown-content, .dropdown:focus-within .dropdown-content { transform: translate(-50%, 12px) scale(1); }
            .dropdown-content::before { left: calc(50% - 6px); }
        }
    </style>
</head>
